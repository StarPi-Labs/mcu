name: Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
      contents: read
      pull-requests: write

env:
  PR_NUMBER: ${{ github.event.number }}
  GREEN: '\033[1;32m'
  YELLOW: '\033[1;33m'
  RED: '\033[1;31m'
  DONE: '\033[0m'

jobs:
  build-app:
    name: PlatformIO Build App
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ${{ github.workspace }}/app/qemu
          key: pio-app-v1-${{ hashFiles('**/app/platformio.ini', '**/app/qemu/.version') }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build app using pio
        run: |
          echo -e "$YELLOW[Info]: Building app...$DONE"
          pio run -vv -d "${{ github.workspace }}/app" || {
            echo -e "$RED[Error]: Build failed for app$DONE"
            exit 1
          }
          echo -e "$GREEN[Success]: App built successfully!$DONE"

      - name: "Build app failure: comment on PR"
        if: ${{ failure() && github.event_name == 'pull_request' }}
        run: gh pr comment $PR_NUMBER --body "Error, build failed for \`app\`. Please check the logs for details."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-examples:
    name: PlatformIO Build Examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ${{ github.workspace }}/app/qemu
          key: pio-build-examples-v1-${{ hashFiles('**/examples/**/platformio.ini') }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build examples using pio
        run: |
          examples_dir="${{ github.workspace }}/examples"

          # Iterate through the example folders
          for example in $(ls "$examples_dir"); do
            echo -e "$YELLOW[Info]: Building example: $example$DONE"
            pio run -vv -d "$examples_dir/$example" || {
              # If the pio run command fails, exit with an error
              echo -e "$RED[Error]: Build failed for example: $example$DONE"
              exit 1
            }
          done
          echo -e "$GREEN[Success]: All examples built successfully!$DONE"

      - name: "Build examples failure: comment on PR"
        if: ${{ failure() && github.event_name == 'pull_request' }}
        run: gh pr comment $PR_NUMBER --body "Error, build failed for one or more examples. Please check the logs for details."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
